[package]
name = "openterm"
version = "0.1.0"
edition = "2021"
description = "OpenTerm — native terminal + ide + ssh, polyglot (Rust/C/Zig/Go) for max efficiency"
authors = ["Susmic"]
rust-version = "1.77"
build = "build.rs"

[features]
default = []
portable = []

[dependencies]
# ui
# OpenTerm owns its INI settings; eframe persists only native window geometry
# and its lightweight UI memory.
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["syntect"] }
# Keep eframe persistence compatible with this crate's Rust 1.77 MSRV.
home = "=0.5.9"

# local pty (cross-plat)
portable-pty = "0.8"

# plumbing
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }

# sys info / neofetch
sysinfo = "0.32"
whoami = "1.5"
dirs = "5"

# base64 for the go agent protocol
base64 = "0.22"

# vault crypto
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Memory"] }

[build-dependencies]
cc = "1.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-small]
inherits = "release"
opt-level = "z"
